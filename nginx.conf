server {
   # from this guide, thanks to Osama Arbid
   # https://www.pulleycloud.com/nginx-certbot-ec2-hello-web
   listen 80;
   server_name workspace.datahub.kth.chepec.se;

   # since we need to use subdirectory to match Github Pages deployment
   # the least we can do is to automatically redirect anyone hitting the
   # server_name to the site in its subdirectory (mostly so I don't have
   # to tell the team to update their URLs, again)
   # https://nginx.org/en/docs/http/ngx_http_rewrite_module.html#return
   location / {
      return 301 /kth-digital-research-handbook;
   }

   location /kth-digital-research-handbook {
      root /usr/share/nginx/html;
      index index.html;
      # basic auth
      try_files $uri $uri/ =404;
      auth_basic "Restricted, please authenticate";
      auth_basic_user_file /etc/nginx/.htpasswd;
   }
}
